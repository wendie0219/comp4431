<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社区就医协助</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#24342f;background:#f5f8f5}*{box-sizing:border-box}body{margin:0}header{background:#17694e;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}header b{font-size:20px}main{max-width:960px;margin:32px auto;padding:0 18px}.card{background:white;border:1px solid #d9e5dd;border-radius:14px;padding:24px;margin:18px 0;box-shadow:0 3px 12px #183b2410}h1{font-size:26px}h2{font-size:20px;margin:0 0 16px}button{background:#17694e;color:#fff;border:0;border-radius:9px;padding:11px 17px;font-size:15px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button.secondary{background:white;color:#17694e;border:1px solid #17694e}input[type=text]{padding:12px;border:1px solid #9fb9a8;border-radius:8px;font-size:16px;width:min(100%,360px)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #d9e5dd;border-radius:9px;padding:14px;margin:9px 0;cursor:pointer}.item:has(input:checked){border-color:#17694e;background:#edf8f0}.item span{line-height:1.7}.muted{color:#66776d}.badge{color:#a26316;font-weight:700}.chat{height:420px;overflow:auto;border:1px solid #d9e5dd;border-radius:10px;padding:16px;background:#fbfdfb}.bubble{max-width:85%;padding:12px 15px;margin:10px 0;border-radius:12px;white-space:pre-wrap;line-height:1.6;background:#e7f1e9}.mine{margin-left:auto;background:#d6e8ff}.error{color:#b02020}pre{white-space:pre-wrap;font-family:inherit;font-size:16px;line-height:1.8}#notice{min-height:24px}</style></head><body><header><b>社区就医协助</b><button class="secondary" id="home" hidden onclick="goHome()">主页</button></header><main id="app"></main><script>
let role='',username='',sid='',selected='',matches=[];const app=document.querySelector('#app');const home=document.querySelector('#home');
async function api(path,data={}){let r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),v=await r.json();if(!r.ok)throw Error(v.error||'操作失败');return v}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function error(e){document.querySelector('#notice')?.replaceChildren(document.createTextNode(e.message))}
function shell(html){app.innerHTML=html+'<p class="error" id="notice"></p>'}function goHome(){role==='user'?userHome():staffHome()}
function landing(){home.hidden=true;shell('<div class="card"><h1>您好，欢迎使用社区就医协助</h1><p class="muted">请选择您的身份</p><div class="row"><button onclick="login()">我是用户</button><button onclick="staffHome()">我是工作人员</button></div></div>')}
function login(){role='user';home.hidden=false;shell('<div class="card"><h1>用户登录</h1><p>请输入用户名，查看您的预约与服务信息。</p><div class="row"><input id="username" type="text" placeholder="用户名"><button onclick="submitLogin()">继续</button></div></div>');document.querySelector('#username').addEventListener('keydown',e=>{if(e.key==='Enter')submitLogin()})}
function submitLogin(){username=document.querySelector('#username').value.trim();if(!username)return error(Error('请输入用户名'));sessionStorage.setItem('username',username);userHome()}
function basic(s){return `用户名：${esc(s.username||s['用户名'])}<br>医院：${esc(s.hospital||s['医院'])}<br>到院时间：${esc((s.arrival||s['日期及到院时间']).replace('T',' '))}`}
async function userHome(note=''){role='user';home.hidden=false;selected='';try{let v=await api('user',{username});shell(`<h1>${esc(username)}，您好</h1>${note?`<p class="badge">${esc(note)}</p>`:''}<section class="card"><h2>我的预约记录</h2>${v.appointments.length?v.appointments.map(a=>`<label class="item"><input type="radio" name="appt" value="${esc(a['预约编号'])}"><span>${basic(a)}<br>预约编号：${esc(a['预约编号'])}</span></label>`).join(''):'<p class="muted">暂无预约记录</p>'}<button onclick="startChat()" ${v.appointments.length?'':'disabled'}>确认</button></section><section class="card"><h2>我的服务信息</h2>${v.services.length?v.services.map(s=>`<div class="item"><span>${basic(s)}<br>服务编号：${esc(s.service_id)}</span>${s.status==='pending'?'<strong class="badge">待处理</strong>':`<button onclick="showDetail('${esc(s.service_id)}')">查看详情</button>`}</div>`).join(''):'<p class="muted">暂无服务信息</p>'}</section>`)}catch(e){error(e)}}
async function startChat(){let a=document.querySelector('input[name=appt]:checked');if(!a)return error(Error('请先选择一条预约'));try{let v=await api('start',{username,appointment_id:a.value});sid=v.service_id;shell('<h1>申请社区协助</h1><div class="card"><div class="chat" id="chat"></div><div class="row" style="margin-top:14px"><input type="text" id="message" placeholder="请输入您的回答"><button id="send" onclick="sendMessage()">发送</button></div></div>');bubble(v.reply);document.querySelector('#message').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()})}catch(e){error(e)}}
function bubble(t,mine=false){let d=document.createElement('div');d.className='bubble'+(mine?' mine':'');d.textContent=t;document.querySelector('#chat').append(d);d.scrollIntoView({block:'end'})}
async function sendMessage(){let input=document.querySelector('#message'),t=input.value.trim();if(!t)return;input.value='';bubble(t,true);document.querySelector('#send').disabled=true;try{let v=await api('message',{service_id:sid,message:t});bubble(v.reply);if(v.back)setTimeout(()=>userHome('请重新选择一条预约记录。'),1300);if(v.done){input.disabled=true;document.querySelector('#send').disabled=true;setTimeout(()=>userHome(),1700)}}catch(e){error(e)}finally{let b=document.querySelector('#send');if(b&&!document.querySelector('#message')?.disabled)b.disabled=false}}
async function staffHome(){role='staff';home.hidden=false;try{let v=await api('staff');shell(`<h1>工作人员服务管理</h1><section class="card"><h2>待处理的服务信息</h2>${v.pending.length?v.pending.map(s=>`<label class="item"><input type="radio" name="service" value="${esc(s.service_id)}"><span>${basic(s)}<br>服务编号：${esc(s.service_id)}</span></label>`).join(''):'<p class="muted">暂无待处理服务</p>'}<button onclick="showMatches()" ${v.pending.length?'':'disabled'}>开始处理</button></section><section class="card"><h2>已处理的服务信息</h2>${v.processed.length?v.processed.map(s=>`<div class="item"><span>${basic(s)}<br>服务编号：${esc(s.service_id)}</span></div>`).join(''):'<p class="muted">暂无已处理服务</p>'}</section>`)}catch(e){error(e)}}
async function showMatches(){let a=document.querySelector('input[name=service]:checked');if(!a)return error(Error('请先选择一条服务'));sid=a.value;try{let v=await api('matches',{service_id:sid});matches=v.matches;shell(`<h1>选择社区服务人员</h1><section class="card"><h2>符合条件的服务人员</h2>${matches.length?matches.map((p,i)=>`<label class="item"><input type="radio" name="person" value="${i}"><span>服务人员：${esc(p['服务人员名称'])}<br>联系方式：${esc(p['服务人员联系方式'])}<br>机构：${esc(p['社区服务机构名称'])}<br>区域：${esc(p['社区服务机构区域'])}<br>服务时间段：${esc(p['服务时间段'])}</span></label>`).join(''):'<p>当前没有符合条件的服务人员。</p>'}<button onclick="assign()" ${matches.length?'':'disabled'}>确认分配</button></section>`)}catch(e){error(e)}}
async function assign(){let x=document.querySelector('input[name=person]:checked');if(!x)return error(Error('请先选择一位服务人员'));let p=matches[Number(x.value)];try{await api('assign',{service_id:sid,name:p['服务人员名称'],phone:p['服务人员联系方式']});shell('<div class="card"><h1>分配完成</h1><p>该服务已移至已处理的服务信息。</p><button onclick="staffHome()">返回主页</button></div>')}catch(e){error(e)}}
async function showDetail(id){try{let v=await api('detail',{service_id:id,username});shell(`<div class="card"><h1>您好，您的申请已处理，以下是您的服务信息。</h1><pre id="detail"></pre><button onclick="copyDetail()">复制服务信息</button></div>`);document.querySelector('#detail').textContent=v.text}catch(e){error(e)}}
async function copyDetail(){try{await navigator.clipboard.writeText(document.querySelector('#detail').textContent);document.querySelector('#notice').textContent='已复制服务信息'}catch(e){error(Error('复制失败，请手动选择文字复制'))}}
landing();
</script></body></html>
