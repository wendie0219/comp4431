</style></head><body><aside class="sidebar" aria-label="主导航"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg class="ui-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.414 14.414C21 12.828 22 11.5 22 9.5a5.5 5.5 0 0 0-9.591-3.676.6.6 0 0 1-.818.001A5.5 5.5 0 0 0 2 9.5c0 2.3 1.5 4 3 5.5l5.535 5.362a2 2 0 0 0 2.879.052 2.12 2.12 0 0 0-.004-3 2.124 2.124 0 1 0 3-3 2.124 2.124 0 0 0 3.004 0 2 2 0 0 0 0-2.828l-1.881-1.882a2.41 2.41 0 0 0-3.409 0l-1.71 1.71a2 2 0 0 1-2.828 0 2 2 0 0 1 0-2.828l2.823-2.762"/></svg></span><span class="brand-text">CareVisit<span style="color:#778c44">.</span></span></div><div class="brand-caption">社区就医协助</div><nav class="side-nav"><button id="side-welcome" onclick="switchRole()" title="欢迎页"><span class="nav-symbol" aria-hidden="true"><svg class="ui-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="nav-text">欢迎页</span></button><button id="side-family" onclick="username?userHome():login()" title="我的覆诊"><span class="nav-symbol" aria-hidden="true"><svg class="ui-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg></span><span class="nav-text">我的覆诊</span></button><button id="side-staff" onclick="staffHome()" title="社区工作台"><span class="nav-symbol" aria-hidden="true"><svg class="ui-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg></span><span class="nav-text">社区工作台</span></button></nav><div class="side-note"><strong>把照顾，安排妥当。</strong>从一次覆诊开始，让家属与社区更好地协作。</div><div class="side-footer">CAREVISIT · 课程演示</div></aside><header class="topbar"><span class="topbar-title">社区就医协助 / <span id="view-label">欢迎使用</span></span><div class="topbar-right"><div id="nav" hidden><button class="secondary" id="home" onclick="goHome()">主页</button><button class="secondary" onclick="switchRole()">切换身份</button></div><span class="profile" aria-label="家属与社区"><svg class="ui-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></span></div></header><main id="app"></main><script>
let role='',username='',sid='',selected='',matches=[];const app=document.querySelector('#app');const nav=document.querySelector('#nav');

function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function error(e){let n=document.querySelector('#notice');if(n){n.classList.add('error');n.textContent=e.message}}
function shell(html){if(typeof leaveChat==='function')leaveChat();document.querySelectorAll('.side-nav button').forEach(b=>b.classList.remove('active'));let active=role==='user'?'family':role==='staff'?'staff':'welcome';document.querySelector('#side-'+active).classList.add('active');document.querySelector('#view-label').textContent=role==='user'?'我的覆诊':role==='staff'?'社区工作台':'欢迎使用';app.innerHTML=html+'<p id="notice" role="status" aria-live="polite"></p>'}function goHome(){role==='user'?userHome():staffHome()}
function switchRole(){role='';username='';sid='';sessionStorage.removeItem('username');landing()}
function submitLogin(){username=document.querySelector('#username').value.trim();if(!username)return error(Error('请输入用户名'));sessionStorage.setItem('username',username);userHome()}
function basic(s){return `用户名：${esc(s.username||s['用户名'])}<br>医院：${esc(s.hospital||s['医院'])}<br>到院时间：${esc((s.arrival||s['日期及到院时间']).replace('T',' '))}`}
function bubble(t,mine=false){let row=document.createElement('div');row.className='message-row'+(mine?' mine-row':'');let avatar=document.createElement('span');avatar.className='message-avatar';avatar.innerHTML=mine?"<svg class=\"ui-icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"5\"/><path d=\"M20 21a8 8 0 0 0-16 0\"/></svg>":"<svg class=\"ui-icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 8V4H8\"/><rect width=\"16\" height=\"12\" x=\"4\" y=\"8\" rx=\"2\"/><path d=\"M2 14h2\"/><path d=\"M20 14h2\"/><path d=\"M15 13v2\"/><path d=\"M9 13v2\"/></svg>";avatar.setAttribute('aria-hidden','true');let d=document.createElement('div');d.className='bubble'+(mine?' mine':'');d.textContent=t;row.append(avatar,d);let chat=document.querySelector('#chat');chat.append(row);chat.scrollTop=chat.scrollHeight}

let staffData={pending:[],processed:[]},staffTab='pending',staffSelected=null;
async function staffHome(){role='staff';nav.hidden=false;shell('<p role="status">正在读取社区申请…</p>');try{staffData=await api('staff');staffTab=staffData.pending.length?'pending':'processed';staffSelected=null;shell(`<div class="work-heading"><div><h1>社区工作台</h1><p>查看家属需求，安排每一次安心出行。</p></div><button class="secondary" onclick="staffHome()">刷新申请</button></div><section class="work-board"><div class="work-toolbar"><div class="work-tabs" role="tablist" aria-label="申请状态"><button id="tab-pending" role="tab" onclick="setStaffTab('pending')">待处理 <span>${staffData.pending.length}</span></button><button id="tab-processed" role="tab" onclick="setStaffTab('processed')">已处理 <span>${staffData.processed.length}</span></button></div><label class="work-search"><span>查找申请</span><input id="staff-search" type="text" placeholder="用户名、医院或服务编号" oninput="renderStaffList()"></label></div><div class="work-body"><div class="work-list-area"><div class="work-list-heading"><span id="work-list-label">申请列表</span><span>按提交时间排序</span></div><div id="work-list" role="tabpanel" aria-label="申请列表"></div><div class="work-list-footer" id="work-list-footer"></div></div><dialog id="staff-dialog" aria-label="申请详情"><div class="dialog-top"><span>申请详情</span><button class="secondary" onclick="closeStaffDetail()" aria-label="关闭申请详情">关闭</button></div><div id="work-detail" class="work-detail"></div></dialog></div></section>`);renderStaffList()}catch(e){error(e)}}
function setStaffTab(tab){staffTab=tab;staffSelected=null;document.querySelector('#staff-search').value='';renderStaffList()}
function renderStaffList(){const query=document.querySelector('#staff-search').value.trim().toLowerCase();const all=staffData[staffTab];const visible=all.map((s,i)=>({s,i})).filter(({s})=>[s.username,s.hospital,s.service_id].some(v=>String(v||'').toLowerCase().includes(query)));for(const tab of ['pending','processed'])document.querySelector('#tab-'+tab).setAttribute('aria-selected',String(tab===staffTab));document.querySelector('#work-list-label').textContent=staffTab==='pending'?'待处理申请':'已处理申请';document.querySelector('#work-list-footer').textContent=`共 ${visible.length} 条申请`;staffSelected=null;document.querySelector('.work-board').classList.toggle('is-empty',visible.length===0);document.querySelector('.work-search').hidden=all.length===0;document.querySelector('#work-list-footer').hidden=visible.length===0;document.querySelector('#work-list').innerHTML=visible.length?`<table class="request-table"><thead><tr><th scope="col">申请人</th><th scope="col">覆诊预约</th><th scope="col">协助需求</th><th scope="col" class="table-action">操作</th></tr></thead><tbody>${visible.map(({s,i})=>`<tr><td><strong>${esc(s.username)}</strong></td><td><span class="table-hospital">${esc(s.hospital)}</span><span class="table-date">${esc(s.arrival.replace('T',' '))}</span></td><td class="table-needs">${esc(needs(s))}</td><td class="table-action"><input hidden type="radio" name="service" value="${esc(s.service_id)}"><button class="secondary" onclick="openStaffDetail(${i},this)">${staffTab==='pending'?'查看并处理':'查看详情'}</button></td></tr>`).join('')}</tbody></table>`:`<div class="work-empty"><span class="empty-symbol" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></span><h2>${query?'没有找到匹配的申请':staffTab==='pending'?'当前没有待处理申请':'还没有已处理记录'}</h2><p>${query?'试试其他用户名、医院或编号。':staffTab==='pending'?'新的家属申请会显示在这里。':'完成分配后，可在这里查看服务安排。'}</p><div class="empty-actions">${query?'<button class="secondary" onclick="clearStaffSearch()">清除搜索</button>':staffTab==='pending'&&staffData.processed.length?'<button class="secondary" onclick="setStaffTab(&quot;processed&quot;)">查看已处理申请 <span aria-hidden="true">→</span></button>':''}</div></div>`}
function clearStaffSearch(){document.querySelector('#staff-search').value='';renderStaffList();document.querySelector('#staff-search').focus()}
function openStaffDetail(index,button){staffSelected=index;button.closest('tr').querySelector('input').checked=true;renderStaffDetail();document.querySelector('#staff-dialog').showModal()}
function closeStaffDetail(){document.querySelector('#staff-dialog').close()}

function renderStaffDetail(){const item=staffSelected===null?null:staffData[staffTab][staffSelected];const panel=document.querySelector('#work-detail');if(!item){panel.innerHTML='<div class="detail-placeholder"><h2>申请详情</h2><p>选择一条申请，在这里查看需求与安排。</p></div>';return}const field=(label,value)=>`<div><dt>${label}</dt><dd>${esc(value||'未填写')}</dd></div>`;panel.innerHTML=`<div class="detail-scroll"><div class="detail-kicker">${staffTab==='pending'?'待安排申请':'服务安排'}</div><h2>${esc(item.hospital)}</h2><p class="detail-date">${esc(item.arrival.replace('T',' '))} 到院</p><div class="detail-section"><h3>家属信息</h3><dl>${field('申请人',item.username)}${field('地区',item.district)}${field('接送地址',item.address)}</dl></div><div class="detail-section"><h3>协助需求</h3><div class="need-tags">${['escort','outbound','return_trip','wheelchair'].filter(k=>item[k]).map(k=>'<span>'+({escort:'陪诊',outbound:'去程接送',return_trip:'回程接送',wheelchair:'轮椅协助'}[k])+'</span>').join('')||'<span>未申请以上项目</span>'}</div></div>${staffTab==='processed'?`<div class="detail-section"><h3>已分配人员</h3><dl>${field('服务人员',item.staff_name)}${field('联系电话',item.staff_phone)}${field('所属机构',item.organization)}${field('服务时段',item.service_slot)}</dl></div>`:''}<p class="detail-id">服务编号：${esc(item.service_id)}</p></div><div class="detail-action">${staffTab==='pending'?'<button onclick="closeStaffDetail();showMatches()">开始处理 <span aria-hidden="true">→</span></button>':'<span class="detail-complete">已完成分配 · 家属端可查看安排</span>'}</div>`}

function publicDirectory(options){
  if (!options?.length) return '';
  const entries = options.map(p => {
    const wheelchair = p.service_type === 'transport'
      ? '<br>全程留坐轮椅：' + (p.wheelchair_onboard === 'yes' ? '公开资料列明支持' : '请向机构确认')
      : '';
    const source = /^https:\/\//.test(p.source_url)
      ? `<br><a href="${esc(p.source_url)}" target="_blank" rel="noopener noreferrer">查看公开来源</a>`
      : '';
    return `<div class="item"><span><strong>${esc(p.provider)} · ${esc(p.service_name)}</strong>
      <br>服务范围：${esc(p.coverage)}
      <br>机构查询电话：${esc(p.public_phone)}
      <br>服务对象／条件：${esc(p.eligibility)}${wheelchair}
      <br>工作人员待确认：${esc(p.staff_check)}${source}</span></div>`;
  }).join('');
  return `<section class="card"><h2>公开服务机构参考</h2>
    <p class="muted">请向机构核实申请资格及车位。下方人员分配使用演示数据。</p><div class="directory-grid">${entries}</div></section>`;
}
async function showMatches(){let a=document.querySelector('input[name=service]:checked');if(!a)return error(Error('请先选择一条服务'));sid=a.value;try{let v=await api('matches',{service_id:sid});matches=v.matches;shell(`<h1>选择社区服务人员</h1>${publicDirectory(v.public_options)}<section class="card"><h2>符合条件的服务人员</h2>${matches.length?matches.map((p,i)=>`<label class="item"><input type="radio" name="person" value="${i}"><span>服务人员：${esc(p['服务人员名称'])}<br>联系方式：${esc(p['服务人员联系方式'])}<br>机构：${esc(p['社区服务机构名称'])}<br>区域：${esc(p['社区服务机构区域'])}<br>服务时间段：${esc(p['服务时间段'])}</span></label>`).join(''):'<p>当前没有符合条件的服务人员。</p>'}<button onclick="assign()" ${matches.length?'':'disabled'}>确认分配</button></section>`)}catch(e){error(e)}}
async function assign(){let x=document.querySelector('input[name=person]:checked');if(!x)return error(Error('请先选择一位服务人员'));let p=matches[Number(x.value)];try{await api('assign',{service_id:sid,name:p['服务人员名称'],phone:p['服务人员联系方式']});shell('<div class="card"><h1>分配完成</h1><p>该服务已移至已处理的服务信息。</p><button onclick="staffHome()">返回主页</button></div>')}catch(e){error(e)}}

// Member C: family-facing views, using the existing A/B API contract.
function landing(){role='';nav.hidden=true;shell(`<div class="welcome"><div><h1><span class="hello">您好，很高兴见到您。</span><br>下一次覆诊，<br>我们一起安排。</h1></div><div class="welcome-art" aria-hidden="true"><div class="orbit"></div><div class="assistant-shape"></div><div class="care-stickers"><div class="care-stamp accompany"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.414 14.414C21 12.828 22 11.5 22 9.5a5.5 5.5 0 0 0-9.591-3.676.6.6 0 0 1-.818.001A5.5 5.5 0 0 0 2 9.5c0 2.3 1.5 4 3 5.5l5.535 5.362a2 2 0 0 0 2.879.052 2.12 2.12 0 0 0-.004-3 2.124 2.124 0 1 0 3-3 2.124 2.124 0 0 0 3.004 0 2 2 0 0 0 0-2.828l-1.881-1.882a2.41 2.41 0 0 0-3.409 0l-1.71 1.71a2 2 0 0 1-2.828 0 2 2 0 0 1 0-2.828l2.823-2.762"/></svg></div><div class="care-stamp calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><path d="M21 14V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8"/><path d="M3 10h18"/><path d="m16 20 2 2 4-4"/></svg></div><div class="care-stamp transport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6 2 7"/><path d="M10 6h4"/><path d="m22 7-2-1"/><rect width="16" height="16" x="4" y="3" rx="2"/><path d="M4 11h16"/><path d="M8 15h.01"/><path d="M16 15h.01"/><path d="M6 19v2"/><path d="M18 21v-2"/></svg></div></div></div></div><div class="role-choice"><section class="role-card"><h2>我是家属 / 用户</h2><button onclick="login()">进入我的覆诊<svg class="ui-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></button></section><section class="role-card staff"><h2>我是工作人员</h2><button onclick="staffHome()">进入社区工作台<svg class="ui-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></button></section></div>`)}

function login(){role='user';nav.hidden=false;shell(`<div class="eyebrow">家属端</div><h1>我的覆诊</h1><section class="card login-panel"><label for="username">用户名</label><p class="muted">输入预约对应的用户名。演示账号：jiwen</p><div class="row"><input id="username" type="text" autocomplete="username" placeholder="例如 jiwen"><button onclick="submitLogin()">查看预约</button></div></section>`);document.querySelector('#username').addEventListener('keydown',e=>{if(e.key==='Enter')submitLogin()});document.querySelector('#username').focus()}
function needs(s){return ['escort','outbound','return_trip','wheelchair'].filter(k=>s[k]).map(k=>({escort:'陪诊',outbound:'去程接送',return_trip:'回程接送',wheelchair:'轮椅协助'}[k])).join(' · ')||'未申请以上项目'}
async function userHome(note=''){role='user';nav.hidden=false;selected='';shell('<p role="status">正在读取预约与服务进度…</p>');try{let v=await api('user',{username});shell(`<div class="eyebrow">家属端 / 我的覆诊</div><h1>${esc(username)}，您好</h1><p class="intro">先选择一次预约，再告诉我们您需要的协助。</p>${note?`<p class="context" role="status">${esc(note)}</p>`:''}<div class="layout"><section class="card"><h2>选择覆诊预约</h2>${v.appointments.length?v.appointments.map(a=>`<label class="item"><input type="radio" name="appt" value="${esc(a['预约编号'])}"><span><strong>${esc(a['医院'])}</strong><br>${esc(a['日期及到院时间'].replace('T',' '))}<br><small class="muted">预约编号 ${esc(a['预约编号'])}</small></span></label>`).join(''):'<p class="empty">这个用户名下暂无预约，请核对用户名。</p>'}<div class="actions"><button id="start" onclick="startChat()" ${v.appointments.length?'':'disabled'}>申请社区协助</button></div></section><section class="card"><div class="row" style="justify-content:space-between"><h2>我的服务进度</h2><button class="secondary" onclick="userHome()">刷新进度</button></div>${v.services.length?v.services.map(s=>`<article class="item"><span><strong>${esc(s.hospital)}</strong><br>${esc(s.arrival.replace('T',' '))}<br>${esc(needs(s))}<br><small class="muted">服务编号 ${esc(s.service_id)}</small><br><span class="badge ${s.status==='processed'?'done':''}">${s.status==='pending'?'待处理':'已处理'}</span>${s.status==='pending'?'<p class="muted">社区工作人员正在安排，请稍后刷新查看。</p>':`<div class="actions"><button data-service="${esc(s.service_id)}" onclick="showDetail(this.dataset.service)">查看最终安排</button></div>`}</span></article>`).join(''):'<p class="empty">暂时没有服务申请。提交后可在这里跟进。</p>'}</section></div>`)}catch(e){error(e)}}
let sending=false;
async function showDetail(id){try{let v=await api('detail',{service_id:id,username});shell(`<div class="eyebrow">家属端 / 最终安排</div><h1>您的覆诊服务安排</h1><p class="intro">请核对服务人员、联系方式及接送信息。估计时间请再与服务人员确认。</p><section class="card"><span class="badge done">已处理</span><div class="arrangement" id="arrangement"></div><pre id="detail" hidden></pre><div class="actions"><button onclick="copyDetail()">复制安排，分享给家人</button><button class="secondary" onclick="userHome()">返回我的覆诊</button></div></section><p class="muted">课程演示：这里显示的是模拟服务安排。</p>`);document.querySelector('#detail').textContent=v.text;for(let line of v.text.split('\n')){let p=document.createElement('p');p.textContent=line;document.querySelector('#arrangement').append(p)}}catch(e){error(e)}}
async function copyDetail(){let value=document.querySelector('#detail').textContent;try{await navigator.clipboard.writeText(value);document.querySelector('#notice').classList.remove('error');document.querySelector('#notice').textContent='已复制，可粘贴分享给家人。'}catch(e){let pre=document.querySelector('#detail');pre.hidden=false;let range=document.createRange();range.selectNodeContents(pre);let selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);error(Error('浏览器未允许自动复制。已选中安排文字，请手动复制。'))}}

</script><script src="/chat.js"></script><script>if(sessionStorage.getItem('active-chat'))resumeChat();else landing();</script></body></html>
